<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FDF8E1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Check List Tour</title>
<style>
  :root{
    --paper: #FDF8E1;
    --paper-line: #F3E9B8;
    --ink: #3A3320;
    --ink-soft: #7D7248;
    --stamp-green: #2F6B4F;
    --stamp-green-bg: #E3EEE6;
    --stamp-red: #A94438;
    --board: #EBD873;
    --board-dark: #B8A23A;
    --card: #FFFEF6;

    --up: #EBD873;      --up-dark: #B8A23A;
    --bo: #C9BFA5;      --bo-dark: #8B8168;
    --dux: #E3EEE6;     --dux-dark: #2F6B4F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height:100vh;
    padding: 40px 16px 80px;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap{ max-width: 560px; margin: 0 auto; }
  .clip{ width: 140px; height: 46px; margin: 0 auto -24px; position: relative; z-index: 2; display:block; }
  .board{
    background: var(--card);
    border: 1px solid var(--board-dark);
    border-radius: 6px;
    box-shadow: 0 2px 0 var(--board-dark), 0 10px 24px rgba(60,50,30,0.12);
    padding: 40px 28px 30px;
    position: relative;
  }
  h1{
    font-family: 'Courier New', Courier, monospace;
    font-size: 26px;
    letter-spacing: 0.5px;
    margin: 0 0 4px;
    text-transform: uppercase;
  }
  .subtitle{ color: var(--ink-soft); font-size: 14px; margin: 0 0 24px; }

  .list{ display:flex; flex-direction:column; gap: 14px; }
  .item{
    background: var(--card);
    border: 1px solid var(--paper-line);
    border-radius: 10px;
    background-image: repeating-linear-gradient(0deg, transparent, transparent 27px, var(--paper-line) 28px);
    overflow: hidden;
  }
  .link{
    display:flex; align-items:center; gap: 16px;
    padding: 16px;
    color: inherit; text-decoration: none;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .link:hover{ background: var(--stamp-green-bg); }
  .link:active{ transform: scale(0.985); }
  .ico{
    flex: 0 0 auto;
    width: 86px; height: 86px;
    border-radius: 14px;
    display:grid; place-items:center;
    border: 2px solid;
    box-shadow: 0 2px 0 currentColor;
  }
  .ico svg{ width: 50px; height: 50px; }
  .item.up  .ico{ background: var(--up);  border-color: var(--up-dark);  color: var(--up-dark); }
  .item.bo  .ico{ background: var(--bo);  border-color: var(--bo-dark);  color: var(--bo-dark); }
  .item.dux .ico{ background: var(--dux); border-color: var(--dux-dark); color: var(--dux-dark); }
  .ico svg{ color: var(--ink); }
  .item.dux .ico svg{ color: var(--stamp-green); }

  .txt{ min-width:0; }
  .name{
    font-family: 'Courier New', Courier, monospace;
    font-size: 22px; font-weight: bold;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .eta{
    display:block;
    font-family: 'Courier New', Courier, monospace;
    font-size: 15px; color: var(--ink-soft);
    margin-top: 4px; white-space: nowrap;
  }
  .eta strong{ color: var(--stamp-green); }
  .arrow{ margin-left:auto; color: var(--ink-soft); font-size: 30px; line-height: 1; }

  .eta-edit{
    display:flex; gap: 8px; align-items:center;
    padding: 10px 16px 14px;
    border-top: 1px dashed var(--board-dark);
    background: var(--card);
  }
  .eta-edit label{
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px;
    color: var(--ink-soft); font-family: 'Courier New', monospace;
  }
  .eta-edit input{
    flex: 1; min-width: 0;
    font-family: inherit; font-size: 16px; padding: 9px 10px;
    border-radius: 5px; border: 1px solid var(--board-dark);
    background: var(--card); color: var(--ink);
  }
  .btn{
    font-family: inherit; font-size: 14px; padding: 9px 12px;
    border-radius: 5px; border: 1px solid var(--board-dark);
    background: var(--card); color: var(--ink);
    cursor: pointer; transition: background 0.15s ease;
  }
  .btn:hover{ background: var(--paper-line); }
  .btn.danger{ color: var(--stamp-red); border-color: var(--stamp-red); }
  .btn.danger:hover{ background: #FBEAE7; }
  .btn.primary{
    width:100%; margin-top: 18px; min-height: 46px;
    background: var(--stamp-green); border-color: var(--stamp-green);
    color:#fff; font-weight: 700;
  }
  .btn.primary:hover{ background: #275a42; }
  .btn.primary:disabled{ opacity: .6; cursor: default; }

  .status{
    font-family: 'Courier New', monospace; font-size: 13px; font-weight: bold;
    text-align:center; padding: 10px 14px; border-radius: 6px; margin-top: 14px;
    animation: popIn 0.25s ease;
  }
  .status.ok{ background: var(--stamp-green-bg); border: 1px solid var(--stamp-green); color: var(--stamp-green); }
  .status.err{ background: #FBEAE7; border: 1px solid var(--stamp-red); color: var(--stamp-red); }
  @keyframes popIn{ from{ transform: scale(0.9); opacity: 0; } to{ transform: scale(1); opacity: 1; } }

  .footer-note{ margin-top: 18px; font-size: 12px; color: var(--ink-soft); text-align:center; }
  .footer-note code{ background: var(--paper-line); padding: 1px 5px; border-radius: 3px; }

  @media (max-width: 700px){
    body{ padding: 20px 8px 60px; }
    .clip{ display: none; }
    .board{ padding: 22px 14px 26px; border-radius: 10px; }
    h1{ font-size: 19px; }
    .subtitle{ font-size: 13px; margin-bottom: 18px; }
    .link{ padding: 14px; gap: 14px; }
    .ico{ width: 78px; height: 78px; }
    .ico svg{ width: 46px; height: 46px; }
    .name{ font-size: 20px; }
    .eta{ font-size: 14px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <svg class="clip" viewBox="0 0 140 46" xmlns="http://www.w3.org/2000/svg">
    <rect x="45" y="0" width="50" height="30" rx="8" fill="#8B8168"/>
    <rect x="55" y="14" width="30" height="20" rx="6" fill="#C9BFA5" stroke="#8B8168" stroke-width="2"/>
  </svg>
  <div class="board">
    <h1>Check List Tour</h1>
    <p class="subtitle" id="subtitle">Tap a project to open its checklist.</p>

    <div class="list" id="list"></div>

    <div class="admin-only">
      <button class="btn primary" id="saveBtn" type="button">Save ETA</button>
      <div id="statusMsg" style="display:none;"></div>
    </div>

    <p class="footer-note admin-only">The link with <code>?admin=1</code> lets you edit the ETAs and opens each project in admin mode — only use that version yourself, and share the plain link with everyone else.</p>
    <p class="footer-note" id="footerViewerNote" style="display:none;">ETA is updated whenever a new sheet is uploaded.</p>
  </div>
</div>

<script>
const PROJECTS = [
  { key: 'upholstery', name: 'Upholstery', cls: 'up',  url: '/up/', icon: 'sofa'  },
  { key: 'board',      name: 'Board',      cls: 'bo',  url: '/bo/', icon: 'board' },
  { key: 'dux',        name: 'DUX',        cls: 'dux', url: '/dux/', icon: 'scan'  },
];

const ICONS = {
  sofa: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11V8a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v3"/><path d="M3 13a2 2 0 0 1 4 0v2h10v-2a2 2 0 0 1 4 0v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M6 19v2M18 19v2"/></svg>',
  board: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M8.5 10l1.5 1.5L12.5 9M8.5 16l1.5 1.5 2.5-2.5"/><path d="M14.5 10.5h1.5M14.5 16.5h1.5"/></svg>',
  scan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8M10 8v8M13 8v8M16 8v8"/></svg>',
};

const urlParams = new URLSearchParams(location.search);
const isAdmin = urlParams.get('admin') === '1';

const listEl = document.getElementById('list');
const saveBtn = document.getElementById('saveBtn');
const statusMsg = document.getElementById('statusMsg');
const subtitleEl = document.getElementById('subtitle');

let etas = {};

function fmt(iso){
  if (!iso) return '**/**/****';
  const [y, m, d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

function render(){
  listEl.innerHTML = PROJECTS.map(p => {
    const href = isAdmin ? p.url + '?admin=1' : p.url;
    const value = etas[p.key] || '';
    const etaText = value ? `<strong>${fmt(value)}</strong>` : fmt('');
    return `
      <div class="item ${p.cls}">
        <a class="link" href="${href}">
          <div class="ico">${ICONS[p.icon]}</div>
          <div class="txt">
            <div class="name">${p.name}</div>
            <span class="eta">${p.name} ETA ${etaText}</span>
          </div>
          <span class="arrow">›</span>
        </a>
        ${isAdmin ? `
        <div class="eta-edit">
          <label for="eta_${p.key}">ETA</label>
          <input type="date" id="eta_${p.key}" data-key="${p.key}" value="${value}">
          <button type="button" class="btn danger" data-clear="${p.key}">Clear</button>
        </div>` : ''}
      </div>`;
  }).join('');

  listEl.querySelectorAll('[data-clear]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.getElementById('eta_' + btn.dataset.clear).value = '';
    });
  });
}

function showStatus(text, ok){
  statusMsg.className = 'status ' + (ok ? 'ok' : 'err');
  statusMsg.textContent = text;
  statusMsg.style.display = 'block';
  clearTimeout(showStatus._t);
  showStatus._t = setTimeout(() => { statusMsg.style.display = 'none'; }, 3000);
}

async function loadEtas(){
  try{
    const res = await fetch('/api/eta', { cache: 'no-store' });
    const data = await res.json();
    etas = data.etas || {};
  }catch(e){
    etas = {};
  }
  render();
}

saveBtn.addEventListener('click', async () => {
  const body = {};
  listEl.querySelectorAll('input[type=date]').forEach(inp => { body[inp.dataset.key] = inp.value; });
  saveBtn.disabled = true;
  try{
    const res = await fetch('/api/eta', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || 'Save failed');
    etas = data.etas || {};
    render();
    showStatus('✓ ETA saved', true);
  }catch(e){
    showStatus('Could not save: ' + e.message, false);
  }finally{
    saveBtn.disabled = false;
  }
});

if (!isAdmin){
  document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
  document.getElementById('footerViewerNote').style.display = 'block';
} else {
  subtitleEl.textContent = 'Admin — set the ETA for each project and save. Shortcuts open in admin mode.';
}

render();
loadEtas();
</script>
</body>
</html>
